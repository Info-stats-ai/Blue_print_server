[package]
name = "blueprint-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "macros", "chrono"] }
jsonwebtoken = "9"
bcrypt = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
tower_governor = "0.8"
similar = "2"
# Pinned to a specific commit (not a branch) so this build is reproducible
# and never silently picks up unrelated i-ide changes. i-ide is a private
# repo — Railway's build needs read credentials for it, injected via
# railway.json's buildCommand at build time (see that file's comment).
text = { git = "https://github.com/Info-stats-ai/I-ide.git", rev = "55adcccb85493c74e36155022c968ec0ded4c0ca" }
clock = { git = "https://github.com/Info-stats-ai/I-ide.git", rev = "55adcccb85493c74e36155022c968ec0ded4c0ca" }
# Only for its `auth` module (asymmetric keypair/encrypt/decrypt) — the
# OAuth loopback callback's local-impersonation fix reuses Zed's own
# existing mechanism (see oauth.rs's doc comment) instead of hand-rolling
# crypto. Doesn't pull in gpui: that's an opt-in feature this doesn't enable.
rpc = { git = "https://github.com/Info-stats-ai/I-ide.git", rev = "55adcccb85493c74e36155022c968ec0ded4c0ca" }
anyhow = "1"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3"
