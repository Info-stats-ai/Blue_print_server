<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shopfront</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 40px; color: #222; }
  .product { border: 1px solid #ddd; border-radius: 8px; padding: 16px; width: 260px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #888; background: #fff; cursor: pointer; }
  #cart { font-weight: 600; margin-top: 16px; }
</style>
</head>
<body>
  <h1>Shopfront</h1>
  <div class="product">
    <h2>Wool socks</h2>
    <p>$12.00</p>
    <button id="add-to-cart">Add to cart</button>
  </div>
  <p id="cart">Cart: 0 items</p>
  <script src="app.js"></script>
</body>
</html>
